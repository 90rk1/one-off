services:
  libreplan-db:
    image: postgres:18
    container_name: libreplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
#      - pg_data:/var/lib/postgresql/data
      - pg_data:/var/lib/postgresql/18/docker/
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  libreplan:
    image: libreplan/libreplan:1.6.0
    container_name: libreplan-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
    depends_on:
      libreplan-db:
        condition: service_healthy
    volumes:
      - libreplan_data:/opt/libreplan/data
#      - ./patches/stax2-api-4.2.1.jar:/usr/local/tomcat/lib/stax2-api-4.2.1.jar
      - ./patches/stax2-api-4.2.1.jar:/usr/local/tomcat/webapps/ROOT/WEB-INF/lib/stax2-api-4.2.1.jar
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M 
        reservations:
          memory: 512M

#    healthcheck:
#      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 60s

volumes:
  pg_data:
  libreplan_data:
