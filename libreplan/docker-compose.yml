services:
  libreplan-db:
    image: postgres:15-alpine
    container_name: libreplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  libreplan:
    image: libreplan/libreplan:1.6.0
    container_name: libreplan-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
    depends_on:
      - libreplan-db
    volumes:
      - libreplan_data:/opt/libreplan/data

volumes:
  postgres_data:
  libreplan_data:
